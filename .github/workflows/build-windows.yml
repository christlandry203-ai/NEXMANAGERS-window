name: Build NEXMANAGER Windows
on:
  push:
    paths:
      - 'NEXMANAGER-Windows/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:
jobs:
  build-windows:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: NEXMANAGER-Windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Préparer WiX Toolset
        shell: pwsh
        run: |
          $wix = Get-ChildItem "C:\Program Files (x86)" -Directory -Filter "WiX Toolset v3*" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $wix) {
            choco install wixtoolset --no-progress -y
            $wix = Get-ChildItem "C:\Program Files (x86)" -Directory -Filter "WiX Toolset v3*" -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if ($wix) { Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $wix.FullName "bin") }
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compiler
        run: gradle packageExe packageMsi createDistributable --no-daemon --stacktrace
      - name: Zipper la version portable
        shell: pwsh
        run: Compress-Archive -Path build/compose/binaries/main/app/NEXMANAGER -DestinationPath NEXMANAGER-Windows-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: NEXMANAGER-Windows-installateur-exe
          path: NEXMANAGER-Windows/build/compose/binaries/main/exe/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: NEXMANAGER-Windows-portable
          path: NEXMANAGER-Windows/NEXMANAGER-Windows-portable.zip
          if-no-files-found: warn
